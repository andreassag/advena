name: create_annotations
description: Generate gzipped source FASTA/GFF3 and ICEscreen-annotated GFF3, EMBL, and GenBank files
keywords:
  - icescreen
  - annotation
  - gff3
  - embl
  - genbank
tools:
  - icescreen:
      description: Detection and annotation of ICEs and IMEs in Bacillota genomes
      homepage: https://github.com/andreassag/icescreen
      licence: ["AGPL-3.0-or-later"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - final_sp:
        type: file
        description: Final detected signature proteins TSV (*_detected_SP.tsv)
        pattern: "*.tsv"
    - detected_me:
        type: file
        description: Detected mobile elements TSV (*_detected_ME.tsv)
        pattern: "*.tsv"
    - genbank:
        type: file
        description: Input annotated genome in GenBank format
        pattern: "*.{gb,gbk,gbff}"
output:
  source_fasta:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_source.fa.gz":
          type: file
          description: Gzipped genome nucleotide FASTA extracted from GenBank
          pattern: "*_source.fa.gz"
  source_gff:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_source.gff.gz":
          type: file
          description: Gzipped source genome GFF3 extracted from GenBank
          pattern: "*_source.gff.gz"
  annotated_gff:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_icescreen.gff.gz":
          type: file
          description: Gzipped GFF3 file with ICEscreen annotations
          pattern: "*_icescreen.gff.gz"
  annotated_embl:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_icescreen.embl.gz":
          type: file
          description: Gzipped EMBL flat file with ICEscreen annotations
          pattern: "*_icescreen.embl.gz"
  annotated_gb:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_icescreen.gb.gz":
          type: file
          description: Gzipped GenBank flat file with ICEscreen annotations
          pattern: "*_icescreen.gb.gz"
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - icescreen:
          type: string
          description: The name of the tool
      - 'python3 -c ''import importlib.metadata; print(importlib.metadata.version("icescreen"))'' 2>/dev/null || echo ''1.3.3''':
          type: eval
          description: The expression to obtain the version of icescreen
    - - ${task.process}:
          type: string
          description: The name of the process
      - biopython:
          type: string
          description: The name of the tool
      - "python3 -c 'import Bio; print(Bio.__version__)'":
          type: eval
          description: The expression to obtain the version of Biopython
authors:
  - "@andreassag"
