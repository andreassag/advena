name: process_hmmscan
description: Filter compiled hmmscan domain hits and select best signature protein hit per locus
keywords:
  - icescreen
  - hmmer
  - filtering
tools:
  - icescreen:
      description: Detection and annotation of ICEs and IMEs in Bacillota genomes
      homepage: https://github.com/andreassag/icescreen
      licence: ["AGPL-3.0-or-later"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - hmmscan_results:
        type: file
        description: Combined 23-column hmmscan TSV (*_hmmscan_all.tsv)
        pattern: "*.tsv"
  - mode_file:
      type: file
      description: Taxonomic phylum mode YAML file
      pattern: "*.yml"
output:
  best_hits:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_hmm_SP.tsv":
          type: file
          description: Best HMM signature protein hit per locus
          pattern: "*_hmm_SP.tsv"
  hmm_unfiltered:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_unfiltered.tsv":
          type: file
          description: Unfiltered annotated HMM hits
          pattern: "*_unfiltered.tsv"
  hmm_filtered:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_filtered.tsv":
          type: file
          description: Filtered HMM hits
          pattern: "*_filtered.tsv"
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - icescreen:
          type: string
          description: The name of the tool
      - 'python3 -c ''import importlib.metadata; print(importlib.metadata.version("icescreen"))'' 2>/dev/null || echo ''1.3.3''':
          type: eval
          description: The expression to obtain the version of icescreen
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - "python3 -c 'import pandas; print(pandas.__version__)'":
          type: eval
          description: The expression to obtain the version of pandas
authors:
  - "@andreassag"
