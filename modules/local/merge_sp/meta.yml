name: merge_sp
description: Merge best BLASTP and HMMER signature protein hits into a unified table
keywords:
  - icescreen
  - merge
  - signature proteins
tools:
  - icescreen:
      description: Detection and annotation of ICEs and IMEs in Bacillota genomes
      homepage: https://github.com/andreassag/icescreen
      licence: ["AGPL-3.0-or-later"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - blast_best:
        type: file
        description: Best BLASTP hits TSV (*_blast_SP.tsv)
        pattern: "*.tsv"
    - hmm_best:
        type: file
        description: Best HMMER hits TSV (*_hmm_SP.tsv)
        pattern: "*.tsv"
output:
  merged:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_detected_SP_source.tsv":
          type: file
          description: Combined BLASTP and HMMER signature protein hits
          pattern: "*_detected_SP_source.tsv"
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - icescreen:
          type: string
          description: The name of the tool
      - 'python3 -c ''import importlib.metadata; print(importlib.metadata.version("icescreen"))'' 2>/dev/null || echo ''1.3.3''':
          type: eval
          description: The expression to obtain the version of icescreen
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - "python3 -c 'import pandas; print(pandas.__version__)'":
          type: eval
          description: The expression to obtain the version of pandas
authors:
  - "@andreassag"
