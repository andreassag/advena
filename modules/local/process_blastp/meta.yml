name: process_blastp
description: Normalize BLASTP headers, filter hits across 7 SP databases, and retain best hit per locus
keywords:
  - icescreen
  - blastp
  - filtering
tools:
  - icescreen:
      description: Detection and annotation of ICEs and IMEs in Bacillota genomes
      homepage: https://github.com/andreassag/icescreen
      licence: ["AGPL-3.0-or-later"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - blast_results:
        type: list
        description: Raw tabular BLASTP TSV files across the 7 SP databases
        pattern: "*.tsv"
  - mode_file:
      type: file
      description: Taxonomic phylum mode YAML file
      pattern: "*.yml"
  - ice_finder_db:
      type: file
      description: SQLite database for ICEfinder annotations
      pattern: "*.db"
output:
  best_hits:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_blast_SP.tsv":
          type: file
          description: Best BLASTP hit per locus tag
          pattern: "*_blast_SP.tsv"
  intyr_hits:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_IntTyr_filtered.tsv":
          type: file
          description: Filtered tyrosine integrase BLASTP hits
          pattern: "*_IntTyr_filtered.tsv"
  blast_raw:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "blastp_output/${prefix}_*.tsv":
          type: list
          description: Header-normalized raw BLASTP outputs for archiving
          pattern: "blastp_output/*.tsv"
  blast_unfiltered:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_*_unfiltered.tsv":
          type: list
          description: Annotated unfiltered BLASTP results
          pattern: "*_unfiltered.tsv"
  blast_filtered:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_*_filtered.tsv":
          type: list
          description: Filtered BLASTP results per database
          pattern: "*_filtered.tsv"
  blast_filtered_best:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_*_filtered_best.tsv":
          type: list
          description: Best filtered BLASTP results per database
          pattern: "*_filtered_best.tsv"
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - icescreen:
          type: string
          description: The name of the tool
      - 'python3 -c ''import importlib.metadata; print(importlib.metadata.version("icescreen"))'' 2>/dev/null || echo ''1.3.3''':
          type: eval
          description: The expression to obtain the version of icescreen
    - - ${task.process}:
          type: string
          description: The name of the tool
      - pandas:
          type: string
          description: The name of the tool
      - "python3 -c 'import pandas; print(pandas.__version__)'":
          type: eval
          description: The expression to obtain the version of pandas
authors:
  - "@andreassag"
