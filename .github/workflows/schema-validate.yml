name: Schema

on:
  push:
    branches: [main, develop]
    paths:
      - "nextflow_schema.json"
      - "assets/schema_input.json"
      - "nextflow.config"
      - "tests/python/validate_schemas.py"
  pull_request:
    branches: [main, develop]
    paths:
      - "nextflow_schema.json"
      - "assets/schema_input.json"
      - "nextflow.config"
      - "tests/python/validate_schemas.py"

jobs:
  validate:
    name: Validate pipeline and input schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate JSON schemas and parameter parity
        run: python3 tests/python/validate_schemas.py
