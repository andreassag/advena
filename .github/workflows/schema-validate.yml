name: Schema

on:
  push:
    branches: [main, develop]
    paths:
      - "nextflow_schema.json"
      - "assets/schema_input.json"
      - "nextflow.config"
  pull_request:
    branches: [main, develop]
    paths:
      - "nextflow_schema.json"
      - "assets/schema_input.json"
      - "nextflow.config"

jobs:
  validate:
    name: Validate pipeline and input schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Schemas are well-formed (Draft 2020-12 meta-schema check)
        run: |
          python - <<'EOF'
          import json, jsonschema
          for path in ("nextflow_schema.json", "assets/schema_input.json"):
              with open(path) as f:
                  schema = json.load(f)
              jsonschema.Draft202012Validator.check_schema(schema)
              print(f"{path} is valid")
          EOF

      - name: Required top-level keys present
        run: |
          python - <<'EOF'
          import json, sys
          with open("nextflow_schema.json") as f:
              schema = json.load(f)
          required = {"$schema", "$id", "title", "description", "type", "allOf"}
          missing = required - schema.keys()
          if missing:
              print(f"Missing keys: {missing}", file=sys.stderr)
              sys.exit(1)
          if "properties" not in schema and "$defs" not in schema:
              print("Schema must have either 'properties' or '$defs'", file=sys.stderr)
              sys.exit(1)
          print("All required top-level keys present")
          EOF
